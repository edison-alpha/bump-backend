# bump-backend behind nginx on the VPS, API only: the app (fe-bump) is deployed on Vercel, so it calls this host cross-site.
# That needs, in the backend's .env: BUMP_ALLOWED_ORIGINS=https://<the app's origin> and BUMP_CROSS_SITE_COOKIE=1
# (the session cookie becomes SameSite=None; Secure; Partitioned).
#
# Replace API_HOST, then: certbot certonly --webroot -w /var/www/bump-acme -d API_HOST
# (the port-80 block below must be live first so Let's Encrypt can reach /.well-known/acme-challenge/).

server {
    listen 80;
    listen [::]:80;
    server_name API_HOST;

    location /.well-known/acme-challenge/ {
        root /var/www/bump-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name API_HOST;

    ssl_certificate /etc/letsencrypt/live/API_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/API_HOST/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
